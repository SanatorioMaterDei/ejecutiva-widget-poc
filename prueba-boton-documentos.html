<!--
  Botón "Documentos Institucionales" para la intranet.

  Es un fragmento autónomo: se ve solo al abrirlo como página y se puede pegar
  tal cual en Wix. Sin dependencias, sin build, todo namespaceado con smd-doc-.

  Al hacer clic sondea un recurso que el portal sirve únicamente a la red
  interna. Si responde, navega al agente. Si no, muestra el aviso.

  El aviso deja continuar a propósito: desde Chrome 142 una página pública que
  pide un subrecurso a una IP privada cae bajo Local Network Access, y desde la
  red del Sanatorio el portal resuelve a 10.1.1.15. O sea que la sonda puede
  fallar para alguien que SÍ está adentro. Las navegaciones top-level están
  exentas de esa restricción, así que "Intentar de todos modos" siempre funciona.
-->
<div id="smd-doc-root">
  <style>
    #smd-doc-root { --smd-accent:#D97706; --smd-dark:#14182b; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
    #smd-doc-btn {
      display:inline-flex; align-items:center; gap:8px; padding:12px 20px;
      background:var(--smd-accent); color:#fff; border:none; border-radius:8px;
      font-size:15px; font-weight:600; cursor:pointer; text-decoration:none;
    }
    #smd-doc-btn:hover { filter:brightness(.94); }
    #smd-doc-btn[aria-busy="true"] { opacity:.7; pointer-events:none; }

    #smd-doc-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.45);
      display:none; align-items:center; justify-content:center; padding:20px; z-index:99999;
    }
    #smd-doc-overlay.smd-open { display:flex; }
    #smd-doc-modal {
      background:#fff; border-radius:14px; padding:28px; max-width:440px; width:100%;
      box-shadow:0 12px 40px rgba(0,0,0,.3); text-align:center;
    }
    #smd-doc-modal h2 { margin:0 0 12px; font-size:17px; color:var(--smd-dark); }
    #smd-doc-modal p  { margin:0 0 22px; font-size:14px; line-height:1.55; color:#4b5563; }
    #smd-doc-actions  { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    #smd-doc-actions button {
      padding:10px 18px; border:none; border-radius:8px; font-size:14px; cursor:pointer;
    }
    #smd-doc-close    { background:var(--smd-dark); color:#fff; }
    #smd-doc-continue { background:transparent; color:#6b7280; text-decoration:underline; }
  </style>

  <a id="smd-doc-btn" href="https://apps.sanatoriomaterdei.com.ar/portal_ia/embed/documentos-institucionales" target="_top">
    Documentos Institucionales
  </a>

  <div id="smd-doc-overlay" role="dialog" aria-modal="true" aria-labelledby="smd-doc-title">
    <div id="smd-doc-modal">
      <h2 id="smd-doc-title">Recurso exclusivo de la red del Sanatorio</h2>
      <p>
        El Asistente de Documentos Institucionales solo está disponible desde la red
        del Sanatorio, por wifi institucional o conectado por VPN. Volvé a intentarlo
        desde una computadora del Sanatorio.
      </p>
      <div id="smd-doc-actions">
        <button id="smd-doc-close" type="button">Entendido</button>
        <button id="smd-doc-continue" type="button">Intentar de todos modos</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var AGENTE = 'https://apps.sanatoriomaterdei.com.ar/portal_ia/embed/documentos-institucionales';
    // Sonda: imagen que el portal sirve solo a la red interna. NO usar
    // favicon.png, que está expuesto a internet y daría "disponible" siempre.
    var SONDA   = 'https://apps.sanatoriomaterdei.com.ar/portal_ia/logo-materdei.png';
    var TIMEOUT = 3000;

    var boton    = document.getElementById('smd-doc-btn');
    var overlay  = document.getElementById('smd-doc-overlay');
    var cerrar   = document.getElementById('smd-doc-close');
    var seguir   = document.getElementById('smd-doc-continue');
    var etiqueta = boton.textContent.trim();

    // Navega la ventana de arriba: si el botón quedó dentro de un embed de Wix
    // (iframe), cambiar location a secas movería solo el iframe.
    function navegar() {
      try { window.top.location.href = AGENTE; }
      catch (err) { console.warn('[smd-doc] sin acceso a window.top:', err); window.location.href = AGENTE; }
    }

    function sondear() {
      return new Promise(function (resolve) {
        var t0 = Date.now(), img = new Image(), listo = false;
        var t = setTimeout(function () { if (!listo) { listo = true; img.src = ''; resolve({ ok:false, ms:Date.now()-t0 }); } }, TIMEOUT);
        img.onload  = function () { if (!listo) { listo = true; clearTimeout(t); resolve({ ok:true,  ms:Date.now()-t0 }); } };
        img.onerror = function () { if (!listo) { listo = true; clearTimeout(t); resolve({ ok:false, ms:Date.now()-t0 }); } };
        img.src = SONDA + '?t=' + Date.now();
      });
    }

    function abrirAviso()  { overlay.classList.add('smd-open'); cerrar.focus(); }
    function cerrarAviso() { overlay.classList.remove('smd-open'); boton.focus(); }

    boton.addEventListener('click', function (e) {
      e.preventDefault();
      boton.setAttribute('aria-busy', 'true');
      boton.textContent = 'Verificando…';
      sondear().then(function (r) {
        boton.removeAttribute('aria-busy');
        boton.textContent = etiqueta;
        console.log('[smd-doc] sonda:', r.ok ? 'portal alcanzable' : 'portal no alcanzable', '(' + r.ms + ' ms)');
        if (r.ok) { navegar(); } else { abrirAviso(); }
      });
    });

    cerrar.addEventListener('click', cerrarAviso);
    seguir.addEventListener('click', navegar);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) cerrarAviso(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('smd-open')) cerrarAviso();
    });
  })();
  </script>
</div>
