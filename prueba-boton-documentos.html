<!--
  ============================================================================
  Botón "Documentos Institucionales" — para la intranet
  Sanatorio Mater Dei
  ============================================================================

  QUÉ ES
  Un botón que lleva al Asistente de Documentos Institucionales. El agente solo
  se sirve dentro de la red del Sanatorio; desde internet el dominio resuelve a
  una IP pública que contesta 403. El botón abre el agente en una pestaña nueva,
  y solo cuando puede PROBAR que el usuario está afuera lo frena antes y muestra
  el aviso, para que no aterrice en la página de error de nginx.

  CÓMO SE INSTALA EN WIX
  1. Editor de Wix -> Agregar (+) -> Incrustar código -> HTML incrustado.
  2. Elegir la opción "Código" y pegar TODO este archivo tal cual.
  3. Ajustar el alto y ancho del elemento para que entre el botón (aprox.
     280 x 64 px). El aviso se dibuja a pantalla completa, no necesita espacio.
  4. Publicar y probar con un clic.

  REQUISITOS
  - No necesita librerías, ni build, ni conexión a ningún servicio externo.
  - Todo está namespaceado con el prefijo smd-doc- para no chocar con estilos
    ni con ids de la página que lo aloje.

  COLORES INSTITUCIONALES (según "Colores permitidos - Web")
  - P295C   #002856  azul institucional, color principal del botón y del aviso.
  - P283C   #92C0E9  azul claro, para foco y detalles.
  - P2707C  #C2D5ED  azul muy claro, para fondos suaves y separadores.
  - Tintes de P295C y escala de grises para texto secundario.
  No usar colores fuera de esta paleta: las variables --smd-* de abajo son el
  único lugar donde hay que tocar si el manual de marca cambia.

  DOS DETALLES QUE NO HAY QUE TOCAR
  - El botón abre el agente en una pestaña nueva, y esa pestaña se pide en el
    mismo click (window.open sobre about:blank) antes de sondear. Si se pidiera
    después, con la sonda ya resuelta, el navegador la bloquearía como popup
    porque el gesto del usuario ya caducó. Si la sonda falla, la pestaña se
    cierra y en su lugar aparece el aviso.
  - Si el navegador igual bloquea la pestaña, se cae al viejo camino:
    window.top.location. Va por window.top y no por location a secas porque
    dentro del iframe del elemento HTML de Wix un location común movería solo
    el iframe y el agente aparecería embutido en un recuadro chico.

  SOBRE EL AVISO (decisión tomada)
  El aviso tiene una sola acción, "Entendido". Antes ofrecía además "Intentar de
  todos modos" y se quitó a pedido. Tenerlo en cuenta: algunos navegadores
  restringen que una página pública consulte recursos de la red interna, así que
  la verificación puede dar negativo para alguien que sí está en la red. Si
  aparecen reportes de gente dentro del Sanatorio que ve el aviso, la causa es
  esa: hay que revisar la sonda (SONDA / TIMEOUT), no el aviso.

  PARA CAMBIAR EL TEXTO del aviso, editar el bloque #smd-doc-modal.
  PARA CAMBIAR LA ETIQUETA del botón, editar el texto dentro de <a id="smd-doc-btn">.
-->

<div id="smd-doc-root">
  <style>
    #smd-doc-root {
      /* Paleta institucional — ver encabezado */
      --smd-azul:#002856;        /* P295C  */
      --smd-azul-hover:#1A3E67;  /* tinte de P295C */
      --smd-azul-claro:#92C0E9;  /* P283C  */
      --smd-azul-suave:#C2D5ED;  /* P2707C */
      --smd-gris:#5C5C5C;        /* escala de grises */
      font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    }
    #smd-doc-btn {
      display:inline-flex; align-items:center; gap:10px; padding:14px 24px;
      background:var(--smd-azul); color:#fff; border:none; border-radius:6px;
      font-size:15px; font-weight:600; letter-spacing:.01em;
      cursor:pointer; text-decoration:none; transition:background .15s ease;
    }
    #smd-doc-btn svg { flex:none; }
    #smd-doc-btn:hover { background:var(--smd-azul-hover); }
    #smd-doc-btn:focus-visible { outline:3px solid var(--smd-azul-claro); outline-offset:2px; }
    #smd-doc-btn[aria-busy="true"] { background:var(--smd-azul-hover); pointer-events:none; }

    #smd-doc-overlay {
      position:fixed; inset:0; background:rgba(0,40,86,.55);
      display:none; align-items:center; justify-content:center; padding:20px; z-index:99999;
    }
    #smd-doc-overlay.smd-open { display:flex; }
    #smd-doc-modal {
      background:#fff; border-radius:10px; border-top:6px solid var(--smd-azul);
      padding:32px 30px 28px; max-width:440px; width:100%;
      box-shadow:0 12px 40px rgba(0,40,86,.28); text-align:center;
    }
    #smd-doc-icono {
      width:56px; height:56px; margin:0 auto 18px; border-radius:50%;
      background:var(--smd-azul-suave); color:var(--smd-azul);
      display:flex; align-items:center; justify-content:center;
    }
    #smd-doc-modal h2 {
      margin:0 0 12px; font-size:18px; line-height:1.35;
      font-weight:700; color:var(--smd-azul);
    }
    #smd-doc-modal p { margin:0 0 24px; font-size:14px; line-height:1.6; color:var(--smd-gris); }
    #smd-doc-actions { display:flex; justify-content:center; }
    #smd-doc-close {
      padding:12px 32px; border:none; border-radius:6px;
      background:var(--smd-azul); color:#fff;
      font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
      transition:background .15s ease;
    }
    #smd-doc-close:hover { background:var(--smd-azul-hover); }
    #smd-doc-close:focus-visible { outline:3px solid var(--smd-azul-claro); outline-offset:2px; }
  </style>

  <a id="smd-doc-btn" href="https://apps.sanatoriomaterdei.com.ar/portal_ia/embed/documentos-institucionales" target="_blank" rel="noopener">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/>
    </svg>
    <span id="smd-doc-btn-texto">Documentos Institucionales</span>
  </a>

  <div id="smd-doc-overlay" role="dialog" aria-modal="true" aria-labelledby="smd-doc-title">
    <div id="smd-doc-modal">
      <div id="smd-doc-icono" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h2 id="smd-doc-title">Recurso exclusivo de la red del Sanatorio</h2>
      <p>
        El Asistente de Documentos Institucionales solo está disponible desde la red
        del Sanatorio, por wifi institucional o conectado por VPN. Volvé a intentarlo
        desde una computadora del Sanatorio.
      </p>
      <div id="smd-doc-actions">
        <button id="smd-doc-close" type="button">Entendido</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var AGENTE = 'https://apps.sanatoriomaterdei.com.ar/portal_ia/embed/documentos-institucionales';
    // Sonda: imagen que el portal sirve solo a la red interna. NO usar
    // favicon.png, que está expuesto a internet y daría "disponible" siempre.
    var SONDA   = 'https://apps.sanatoriomaterdei.com.ar/portal_ia/logo-materdei.png';
    var TIMEOUT = 3000;

    var boton    = document.getElementById('smd-doc-btn');
    var rotulo   = document.getElementById('smd-doc-btn-texto');
    var overlay  = document.getElementById('smd-doc-overlay');
    var cerrar   = document.getElementById('smd-doc-close');
    var etiqueta = rotulo.textContent.trim();

    // La pestaña se pide en el mismo click, ANTES de sondear: si se pidiera dentro
    // del .then() el navegador la bloquearía como popup, porque el gesto del
    // usuario ya habría caducado. Si la sonda falla, la pestaña se cierra.
    function abrirPestana() {
      var w = window.open('', '_blank');
      if (w) { try { w.opener = null; } catch (err) {} }
      return w;
    }

    function navegar(pestana) {
      if (pestana && !pestana.closed) { pestana.location.replace(AGENTE); return; }
      // Sin pestaña (popup bloqueado): último recurso, window.top. Va por window.top
      // y no por location a secas porque dentro del iframe de Wix un location común
      // movería solo el iframe.
      try { window.top.location.href = AGENTE; }
      catch (err) { console.warn('[smd-doc] sin acceso a window.top:', err); window.location.href = AGENTE; }
    }

    // ── Cómo se decide si el usuario está afuera ──────────────────────────────
    // El dominio tiene DNS partido: adentro resuelve a 10.1.1.15, una IP privada, y
    // desde internet a una IP pública cuyo nginx contesta 403. Tres situaciones, una
    // sola justifica el aviso. Medido en Chromium 148:
    //
    //   adentro, Chromium (Local Network Access bloquea)  img onerror | fetch RECHAZA  -> navegar
    //   afuera (el borde público contesta 403)            img onerror | fetch RESUELVE -> AVISO
    //   adentro, Firefox/Safari (no implementan LNA)      img ONLOAD  | fetch resuelve  -> navegar
    //
    // Cada señal contesta una pregunta distinta: la imagen dice "¿puedo obtener el
    // recurso?" y el fetch dice "¿mi pedido llegó a algún servidor?". Haber llegado y
    // NO haber obtenido el recurso es la firma de estar afuera. NO decidir esto por
    // tiempo: un 403 del borde público (69 ms) es MÁS rápido que un rechazo por
    // política (76 ms), porque es un viaje completo de ida y vuelta.

    // ¿Puedo obtener el recurso? Solo onload cuenta como sí.
    function tengoElRecurso() {
      return new Promise(function (resolve) {
        var img = new Image(), listo = false;
        function fin(v) { if (!listo) { listo = true; resolve(v); } }
        setTimeout(function () { img.src = ''; fin(false); }, TIMEOUT);
        img.onload  = function () { fin(true); };
        img.onerror = function () { fin(false); };
        img.src = SONDA + '?i=' + Date.now();
      });
    }

    // ¿El pedido llegó a algún servidor? En no-cors la respuesta es opaca y el status no
    // se puede leer, pero alcanza con que la promesa resuelva: eso ya prueba que salió y
    // volvió. Si Local Network Access lo bloquea, el navegador ni lo manda y rechaza.
    function llegoAUnServidor() {
      return new Promise(function (resolve) {
        var listo = false;
        function fin(v) { if (!listo) { listo = true; resolve(v); } }
        setTimeout(function () { fin(false); }, TIMEOUT);
        try {
          fetch(SONDA + '?f=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
            .then(function () { fin(true); }, function () { fin(false); });
        } catch (err) { fin(false); }
      });
    }

    // 'adentro' | 'afuera' | 'no-se'
    function sondear() {
      var t0 = Date.now();
      return new Promise(function (resolve) {
        var listo = false;
        function fin(v) { if (!listo) { listo = true; resolve({ veredicto:v, ms:Date.now()-t0 }); } }
        var recurso = tengoElRecurso(), llego = llegoAUnServidor();
        // Si la imagen carga ya está todo dicho; no se espera al fetch, que con el cartel
        // de permiso de red local en pantalla puede quedar colgado hasta el TIMEOUT.
        recurso.then(function (ok) { if (ok) { fin('adentro'); } });
        Promise.all([recurso, llego]).then(function (v) {
          fin(v[0] ? 'adentro' : (v[1] ? 'afuera' : 'no-se'));
        });
      });
    }

    function abrirAviso()  { overlay.classList.add('smd-open'); cerrar.focus(); }
    function cerrarAviso() { overlay.classList.remove('smd-open'); boton.focus(); }

    boton.addEventListener('click', function (e) {
      e.preventDefault();
      var pestana = abrirPestana();
      boton.setAttribute('aria-busy', 'true');
      rotulo.textContent = 'Verificando…';
      sondear().then(function (r) {
        boton.removeAttribute('aria-busy');
        rotulo.textContent = etiqueta;
        console.log('[smd-doc] sonda:', r.veredicto, '(' + r.ms + ' ms)');
        // Único caso que muestra el aviso: llegamos a un servidor y nos negó el recurso.
        // Confirmación positiva de estar afuera, nunca sospecha.
        if (r.veredicto === 'afuera') {
          if (pestana && !pestana.closed) { pestana.close(); }
          abrirAviso();
          return;
        }
        if (r.veredicto === 'no-se') {
          console.log('[smd-doc] el navegador no dejó salir el pedido: no pruebo nada, abro el agente igual.');
        }
        navegar(pestana);
      });
    });

    cerrar.addEventListener('click', cerrarAviso);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) cerrarAviso(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('smd-open')) cerrarAviso();
    });
  })();
  </script>
</div>
